name: Generate Pac-Man
 
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:          
  push:
    branches: [main]
 
jobs:
  pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Generate Pac-Man SVG
        uses: hugoalh/github-action-ghcontrib-pacman@v1
        with:
          github_user_name: nachitokit
          outputs: |
            pacman-contribution-grid.svg:github-dark
          github_token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Push output to branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
